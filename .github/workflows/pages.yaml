name: Bundle and Publish

# Forgejo is canonical and push-mirrors to GitHub; this runs on the GitHub copy.
# Pages is deployed from an artifact, not a gh-pages branch: the push mirror
# deletes any branch that exists only on GitHub.

on:
  push:
    branches:
      - "[0-9]+.[0-9]+/*"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Bundle
    # Forgejo also reads .github/workflows; only GitHub can deploy Pages.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Conformance Checks
        run: npm run conformance
      - name: Bundle Extensions
        run: npm run bundle
      - name: Lay Out Site
        # Served at https://<owner>.github.io/<repo>/<branch>, the layout every
        # Paperback 0.9 repository uses.
        run: |
          mkdir -p "_site/${GITHUB_REF_NAME}"
          cp -r bundles/. "_site/${GITHUB_REF_NAME}/"
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy
    needs: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
